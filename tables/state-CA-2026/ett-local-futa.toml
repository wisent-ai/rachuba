# ---------------------------------------------------------------------------
# CALIFORNIA EMPLOYMENT TRAINING TAX (ETT). Employer-only.
# ---------------------------------------------------------------------------
#
# Source [1] page ii: "The 2026 ETT rate is 0.1 percent (.001) on the first
# $7,000 of each employee's wages." Source [1] page 8: "The tax rate is set by
# statute at 0.1 percent (.001) of UI taxable wages for employers with positive
# UI reserve account balances and subject to section 977(c) of the California
# Unemployment Insurance Code (CUIC). The maximum tax is $7 per employee per
# year ($7,000 x .001)."
#
# TWO CONSEQUENCES A CONSUMER MUST NOT MISS:
#
#   1. ETT is NOT owed by every employer. It applies to employers with a
#      POSITIVE UI reserve account balance. An employer with a negative reserve
#      account is not assessed ETT, and its DE 2088 shows an ETT rate of 0.0%.
#      `applies_only_with_positive_reserve_account` records that this is a
#      per-employer condition read off the DE 2088, not a property of the year.
#   2. The wage base is the UI taxable wage base, the same $7,000, tracked on
#      the same wages. It is stored separately anyway so that a future
#      divergence needs no code change.
#
# Unlike the UI rate, the ETT rate is set by statute and is NOT protestable:
# source [1] page 77, "You may protest any item on the DE 2088 except
# Employment Training Tax, which is specifically set by law."
[ett]
rate_ppm = 1000
wage_base = "7000.00"
max_tax = "7.00"
applies_only_with_positive_reserve_account = true

# ---------------------------------------------------------------------------
# LOCAL INCOME TAX WITHHOLDING: NONE, ANYWHERE IN CALIFORNIA.
# In particular none in San Francisco, whose payroll expense tax was repealed (2. below).
# ---------------------------------------------------------------------------
#
# This section exists to record a NEGATIVE finding explicitly, because "no key"
# is indistinguishable from "nobody looked". The answer for San Francisco is a
# researched no, not an omission.
#
# 1. STATE PREEMPTION. Source [5], California Revenue and Taxation Code section
#    17041.5, as amended by Stats. 1965, Ch. 1319:
#
#      "Notwithstanding any statute, ordinance, regulation, rule or decision to
#      the contrary, no city, county, city and county, governmental subdivision,
#      district, public and quasi-public corporation, municipal corporation,
#      whether incorporated or not or whether chartered or not, shall levy or
#      collect or cause to be levied or collected any tax upon the income, or
#      any part thereof, of any person, resident or nonresident. This section
#      shall not be construed so as to prohibit the levy or collection of any
#      otherwise authorized license tax upon a business measured by or according
#      to gross receipts."
#
#    "city and county" names San Francisco's own form of government. So the bar
#    is general: no California locality can impose a personal income tax, and
#    therefore none can impose the local wage withholding that such a tax would
#    require. The second sentence is why San Francisco's business taxes are
#    measured by gross receipts and payroll expense instead: those are taxes on
#    the BUSINESS, expressly permitted, and they are outside the payroll
#    withholding path entirely.
#
#    This is the structural reason California needs nothing analogous to
#    [nyc] or [yonkers] in state-NY-2026.toml.
#
# 2. THE SAN FRANCISCO PAYROLL EXPENSE TAX WAS REPEALED, NOT ZEROED. Source [6],
#    the Treasurer & Tax Collector's own page: "Proposition F was approved by
#    San Francisco voters on November 3, 2020 and became effective January 1,
#    2021. Proposition F eliminates the City's Payroll Expense Tax and gradually
#    raises the Gross Receipts Tax rates across most industries ... Proposition F
#    will complete the City's transition away from payroll taxes." Its overview
#    list begins "Eliminates the Payroll Expense Tax (filed in 2022 for tax
#    year 2021)". Article 12-A of the San Francisco Business and Tax Regulations
#    Code is accordingly marked repealed, and the Treasurer's current "Taxes &
#    Fees" index carries no Payroll Expense Tax entry.
#
#    The distinction matters for a roll-forward: a tax phased to a 0% rate could
#    return by rate change alone, whereas a repealed article requires new
#    legislation. Either way it was ALWAYS an employer tax measured by the
#    employer's payroll expense, never an amount withheld from an employee, so
#    even while it existed it never belonged in a withholding engine.
#
# 3. EVERY OTHER SAN FRANCISCO EMPLOYMENT-RELATED LEVY IS EMPLOYER-SIDE. The
#    Gross Receipts Tax, the Administrative Office Tax (which IS measured by San
#    Francisco payroll expense), the Homelessness Gross Receipts Tax, the
#    Overpaid Executive Gross Receipts Tax, the Commercial Rents Tax and the
#    annual Business Registration Fee are all taxes or fees on the business,
#    filed on the Annual Business Tax Return. Proposition M (approved
#    2024-11-05, operative 2025-01-01) restructured several of them; it created
#    no employee withholding. Two further San Francisco obligations that look
#    payroll-shaped are not deductions either: the Health Care Security
#    Ordinance imposes an employer SPENDING requirement, and the Paid Parental
#    Leave Ordinance imposes an employer SUPPLEMENTAL PAY obligation on top of
#    California Paid Family Leave. None of these is withheld from wages, so none
#    appears in this file. They are business-tax and employer-cost matters,
#    outside a payroll withholding engine's scope.
#
# The single key below is the whole operative content of this section.
[local]
# Amount of local income tax to withhold from an employee working in San
# Francisco, or anywhere else in California: none, and no local rate exists to
# configure. A consumer must not look for one.
employee_withholding = false

# ---------------------------------------------------------------------------
# FUTA CREDIT REDUCTION FOR CALIFORNIA.
# ---------------------------------------------------------------------------
#
# Source [7]: an outstanding Title XII advance can reduce the state's FUTA
# credit for the whole tax year if not repaid by November 10. The reduction
# is paid with Form 940 the following January. The operator enters the rate
# from that year's Schedule A in company.futa_credit_reduction_ppm; historical
# determinations below are not a forecast for 2026.

[futa_credit_reduction]

# DETERMINED, FINAL, HISTORICAL. Source [7], "Actual FUTA Credit Reductions
# 2010-2025", and independently source [8], the instructions to Schedule A
# (Form 940) for 2025: "Credit reduction states for 2025. The credit reduction
# rate for California is 0.012 (1.2%)." Net FUTA for 2025 was therefore
# 0.6% + 1.2% = 1.8% on the first $7,000, i.e. $126.00 per employee.
#
# Rows are [tax_year, credit_reduction_ppm]. TWO-ELEMENT ROWS, DELIBERATELY,
# so they cannot be mistaken for the three-element [at_least, base_tax,
# rate_ppm] bracket shape used above: the first element is a YEAR, not a money
# threshold, and there is no rate to apply to an excess.
#
# Source [7] marks every California year from 2014 onward with its footnote 3,
# "For this year the state received credit reduction add-on relief" -- that is,
# the additional add-ons were waived and only the base reduction was assessed.
# California's current run of consecutive January 1s began with tax year 2022
# after a gap: source [7] also shows 0.3%/0.6%/0.9%/1.2% for 2011-2013 and
# 1.2%-2.1% for 2014-2017 from the previous episode, then nothing for 2018-2021.
determined = [
  [2022,  3000],
  [2023,  6000],
  [2024,  9000],
  [2025, 12000],
]

# The 2026 determination is not in the published Schedule A yet. When it is,
# add [2026, rate_ppm] above from the final IRS instructions. Until then, a
# configured rate is an estimate rather than a determined liability.
test_date = "2026-11-10"
