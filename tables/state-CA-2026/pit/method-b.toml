# Method B - Table 2: Estimated Deduction Table.
# Source [1] page 46; source [2] page 5.
#
# NOT BRACKET ROWS. Each period's value is a TEN-ELEMENT array indexed by the
# number of ADDITIONAL withholding allowances for estimated deductions claimed
# on Form DE 4, for counts 1 through 10; element 0 of the array is the amount
# for ONE such allowance. There is no rate and no threshold here.
#
# WHICH ALLOWANCE COUNT THIS IS. Source [2] page 1 and source [1] page 43
# footnote 1 keep two allowance counts strictly apart:
#   - REGULAR withholding allowances (DE 4 line 1) drive Table 1, Table 3 and
#     Table 4;
#   - ADDITIONAL allowances for ESTIMATED DEDUCTIONS (DE 4 line 2) drive this
#     table ONLY, and source [1] page 43 footnote 1 is explicit that such
#     allowances "must not be used in the determination of tax credits to be
#     subtracted", i.e. they never enter Table 4.
# Source [1] page 43 Example B is the case that pins this down: three
# allowances claimed, one of them for estimated deductions, so Table 2 is read
# at 1 ($38) while Table 1, Table 3 and Table 4 are all read at 2 regular
# allowances.
#
# If the employer holds a pre-2020 Form W-4 rather than a DE 4, source [2]
# page 1 requires all additional estimated-deduction allowances to be treated
# as REGULAR allowances (so this table is not used at all) unless the employee
# asks in writing for the split treatment.
#
# ABOVE TEN. Source [1] page 46 footnote 2: "If the number of Additional
# Withholding Allowances for Estimated Deductions claimed is greater than 10,
# multiply the amount shown for one Additional Allowance by the number
# claimed." So for n > 10 the value is n * element 0, NOT an extrapolation of
# the printed row. See the same discontinuity, quantified, under
# [pit.exemption_allowance].
#
# The printed cells are round-half-up(n * $1,000 / periods_per_year) to the
# dollar, which is why they are not n times element 0 (weekly n=3 prints $58,
# not 3 * $19 = $57). Transcribed as printed.
[pit.estimated_deduction]
weekly      = [   "19.00",   "38.00",   "58.00",   "77.00",   "96.00",  "115.00",  "135.00",  "154.00",  "173.00",   "192.00" ]
biweekly    = [   "38.00",   "77.00",  "115.00",  "154.00",  "192.00",  "231.00",  "269.00",  "308.00",  "346.00",   "385.00" ]
semimonthly = [   "42.00",   "83.00",  "125.00",  "167.00",  "208.00",  "250.00",  "292.00",  "333.00",  "375.00",   "417.00" ]
monthly     = [   "83.00",  "167.00",  "250.00",  "333.00",  "417.00",  "500.00",  "583.00",  "667.00",  "750.00",   "833.00" ]
quarterly   = [  "250.00",  "500.00",  "750.00", "1000.00", "1250.00", "1500.00", "1750.00", "2000.00", "2250.00",  "2500.00" ]
semiannual  = [  "500.00", "1000.00", "1500.00", "2000.00", "2500.00", "3000.00", "3500.00", "4000.00", "4500.00",  "5000.00" ]
annual      = [ "1000.00", "2000.00", "3000.00", "4000.00", "5000.00", "6000.00", "7000.00", "8000.00", "9000.00", "10000.00" ]
daily       = [    "4.00",    "8.00",   "12.00",   "15.00",   "19.00",   "23.00",   "27.00",   "31.00",   "35.00",    "38.00" ]

# Method B - Table 4: Exemption Allowance Table.
# Source [1] page 47; source [2] page 6.
#
# NOT BRACKET ROWS, and NOT A DEDUCTION FROM WAGES. This is a TAX CREDIT,
# subtracted from the computed tax at Step 5, after the bracket lookup. Source
# [1] page 43, Step 5: "Subtract the tax credit shown in Table 4 - Exemption
# Allowance Table from the computed tax liability to arrive at the amount of tax
# to be withheld." Subtracting it from wages instead of from tax is a large
# error, not a rounding one.
#
# Ten-element array indexed by the number of REGULAR withholding allowances,
# 1 through 10; element 0 is the credit for ONE allowance. The publication also
# prints a row for 0 allowances, which is $0.00 in every period and is
# therefore not stored: zero allowances means zero credit.
#
# The printed cells are round-half-up(n * $168.30 / periods_per_year) to the
# cent, verified for all 80 of them. $168.30 is the annual value of one
# allowance.
#
# ABOVE TEN: A GENUINE DISCONTINUITY, TRANSCRIBED FAITHFULLY. Source [1] page
# 47 footnote 1: "If the number of allowances claimed exceeds 10, you may
# determine the amount of tax credit to be allowed by multiplying the amount for
# one allowance by the total number of allowances. For example, the amount of
# tax credit for a married taxpayer with 15 allowances ... on a weekly payroll
# period would be $48.60." That is 15 * $3.24, and it does NOT equal
# round(15 * 168.30 / 52) = $48.55. So the rule changes shape at 11:
#
#   weekly, n = 10 -> $32.37  (printed row)      = round(10 * 168.30/52)
#   weekly, n = 11 -> $35.64  (11 * $3.24)       vs round(11 * 168.30/52) = $35.60
#   weekly, n = 15 -> $48.60  (15 * $3.24)       vs round(15 * 168.30/52) = $48.55
#
# Use the printed array for n <= 10 and n * element 0 for n > 10. The
# publication's own worked figure of $48.60 reproduces exactly under that rule.
# Do not "smooth" the seam; the employer is entitled to the published amount.
#
# There is no cap on the number of allowances.
[pit.exemption_allowance]
weekly      = [  "3.24",  "6.47",  "9.71", "12.95", "16.18", "19.42",  "22.66",  "25.89",  "29.13",  "32.37" ]
