# ---------------------------------------------------------------------------
# CALIFORNIA PERSONAL INCOME TAX (PIT) WITHHOLDING.
# Method B - Exact Calculation Method.
# ---------------------------------------------------------------------------

[pit]
# Source [1] page 18, "How to Withhold PIT on Supplemental Wages". TWO
# DIFFERENT FLAT RATES, and they are not interchangeable:
#
#   Bonuses and stock options ........................ 10.23 percent (.1023)
#   Other types (overtime pay, commissions, sales
#     awards, severance, and vacation pay) ...........  6.6 percent (.066)
#
# "This only applies to stock options that are considered wages subject to PIT
# withholding" (source [1] page 18).
#
# Both flat rates are available ONLY when the supplemental wage is NOT paid at
# the same time as regular wages. Source [1] page 18: if it IS paid at the same
# time, "you are required to treat the sum of the payments as regular wages and
# withhold PIT based on the regular payroll period using the PIT withholding
# schedules" -- the flat rates are not an option in that case. When paid
# separately the employer may instead use the aggregate method (compute Method B
# on regular + supplemental, subtract the Method B tax on regular alone).
#
# Neither flat rate allows any withholding allowance: source [1] page 18,
# "without allowing for any withholding allowances claimed by the employee".
# So no Table 1, 2, 3 or 4 amount enters a flat-rate supplemental computation,
# and in particular the low income exemption does NOT apply to it.
#
# 10.23% is also the sixth rate in every one of the 24 tax rate tables below,
# and 6.6% is the fourth. That is a coincidence of the 1.1 factor, not a
# relationship a consumer may rely on; these are separate published figures.
supplemental_rate_bonus_and_stock_options_ppm = 102300
supplemental_rate_other_ppm = 66000

# Source [2] page 1: Method A, the Wage Bracket Table Method, is "Limited to
# wages or salaries less than $1 million". Method B, the exact calculation
# method transcribed here, carries no such limit and is the only method valid
# at and above $1,000,000. Source [1] page 42 confirms this from the other
# side: the last line of every Method A wage bracket table reads "& Over (Use
# Method B - Exact Calculation Method)".
#
# Recorded so that a consumer can assert it never needs Method A, which this
# file deliberately does not carry. Method B is exact at every wage level.
method_a_wage_limit = "1000000.00"

# Method B - Table 1: Low Income Exemption Table.
# Source [1] page 46; source [2] page 5.
#
# STEP 1 SHORT-CIRCUITS THE WHOLE CALCULATION. Source [1] page 43, Step 1:
# "Determine if the employee's gross wages are less than, or equal to, the
# amount shown in Table 1 - Low Income Exemption Table. If so, no income tax is
# required to be withheld." The comparison is against GROSS wages, before any
# estimated deduction (Table 2) and before the standard deduction (Table 3),
# and it is `<=`, so a gross wage exactly equal to the figure withholds nothing.
#
# This is not a zero bracket and not a deduction. It is a cliff: one cent above
# the figure, the full Method B computation runs on the full gross. Source [1]
# page 43 Example A is exactly this case (weekly $210 against $363: nothing
# withheld, no further steps).
#
# THE COLUMN NAMES BELOW ARE NOT FILING STATUSES. See the header. A married
# employee's column depends on the number of REGULAR allowances claimed.
[pit.low_income_exemption]
weekly      = { single_or_dual_income_married =   "363.00", married_0_or_1_allowances =   "363.00", married_2_or_more_allowances =   "727.00", head_of_household =   "727.00" }
biweekly    = { single_or_dual_income_married =   "727.00", married_0_or_1_allowances =   "727.00", married_2_or_more_allowances =  "1454.00", head_of_household =  "1454.00" }
semimonthly = { single_or_dual_income_married =   "787.00", married_0_or_1_allowances =   "787.00", married_2_or_more_allowances =  "1575.00", head_of_household =  "1575.00" }
monthly     = { single_or_dual_income_married =  "1575.00", married_0_or_1_allowances =  "1575.00", married_2_or_more_allowances =  "3149.00", head_of_household =  "3149.00" }
quarterly   = { single_or_dual_income_married =  "4724.00", married_0_or_1_allowances =  "4724.00", married_2_or_more_allowances =  "9448.00", head_of_household =  "9448.00" }
semiannual  = { single_or_dual_income_married =  "9448.00", married_0_or_1_allowances =  "9448.00", married_2_or_more_allowances = "18896.00", head_of_household = "18896.00" }
annual      = { single_or_dual_income_married = "18896.00", married_0_or_1_allowances = "18896.00", married_2_or_more_allowances = "37791.00", head_of_household = "37791.00" }
daily       = { single_or_dual_income_married =    "73.00", married_0_or_1_allowances =    "73.00", married_2_or_more_allowances =   "145.00", head_of_household =   "145.00" }

# Method B - Table 3: Standard Deduction Table.
# Source [1] page 47; source [2] page 6.
#
# Subtracted at Step 3 to produce taxable income. Same four printed columns and
# the same column-selection rule as Table 1, and the values are consistently
# smaller than the corresponding low income exemption, which is why taxable
# income is always positive once Step 1 has been passed -- UNLESS estimated
# deduction allowances are claimed at Step 2, which can drive it negative. See
# local://ca-withholding-algorithm.md section 6.
[pit.standard_deduction]
weekly      = { single_or_dual_income_married =  "110.00", married_0_or_1_allowances =  "110.00", married_2_or_more_allowances =   "219.00", head_of_household =   "219.00" }
