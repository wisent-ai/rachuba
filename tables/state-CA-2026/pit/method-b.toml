monthly     = [ "14.03", "28.05", "42.08", "56.10", "70.13", "84.15",  "98.18", "112.20", "126.23", "140.25" ]
quarterly   = [ "42.08", "84.15", "126.23", "168.30", "210.38", "252.45", "294.53", "336.60", "378.68", "420.75" ]
semiannual  = [ "84.15", "168.30", "252.45", "336.60", "420.75", "504.90", "589.05", "673.20", "757.35", "841.50" ]
annual      = [ "168.30", "336.60", "504.90", "673.20", "841.50", "1009.80", "1178.10", "1346.40", "1514.70", "1683.00" ]
