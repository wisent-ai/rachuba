# Method B - Tables 5 through 28: Tax Rate Tables.
# Source [1] pages 48-51; source [2] pages 7-10.
#
# Applied at Step 4, to TAXABLE INCOME (gross, less any Table 2 estimated
# deduction, less the Table 3 standard deduction), selected by payroll period
# and by MARITAL STATUS. Source [1] page 43, Step 4: "Use Tables 5-28 - Tax
# Rate Table for the payroll period and marital status to find the applicable
# line on which the taxable income is located."
#
# THE STATUS USED HERE IS THE PLAIN MARITAL STATUS, WITH NO ALLOWANCE-COUNT
# SPLIT. A married employee uses `married_one_employer` whatever the allowance
# count, even though that same employee's Table 1 and Table 3 amounts DO depend
# on the allowance count. Source [1] page 43 Example B is the proof: a married
# employee with 2 regular allowances takes the married-'2'-or-more Table 1 and
# Table 3 figures ($1,454 and $439) and the plain Married bi-weekly rate table
# (Table 27, "over $852 but not over $2,020", plus $9.37).
#
# The three keys are California's three published schedules:
#   single_or_dual_income_married  "Single Persons, Dual Income Married or
#                                  Married with Multiple Employers"
#   married_one_employer           "Married Persons"
#   head_of_household              "Unmarried/Head of Household"
#
# `married_one_employer` is named for what distinguishes it: a married employee
# whose spouse also works, or who has more than one employer, uses the SINGLE
# schedule, not this one. Source [2] page 1, "Special Note for Married Employees
# with Employed Spouses", recommends exactly that ("Single filing status to
# compute withholding amounts for the employee and spouse; or withhold an
# additional flat amount of tax") to avoid underwithholding.
#
# Unlike New York, California DOES have a head-of-household withholding
# schedule; a head-of-household filer must not be routed to the single tables.
#
# The rate column is strictly increasing in every table, and every row's
# base_tax closes into the next to within half a cent (checked for all 240
# rows). There is no recapture table, no top-rates method, and no regime change
# above the schedule: the final row of every table is genuinely unbounded, and
# source [1] pages 48-51 print it as "and over". The only post-lookup step is
# subtracting the Table 4 credit.

