# Social Security (OASDI). Wage base per SSA announcement for 2026.
[social_security]
employee_rate_ppm = 62000
employer_rate_ppm = 62000
wage_base = "184500.00"

# Medicare (HI). No wage base. The Additional Medicare Tax is employee-only:
# the employer does not match it. Employers withhold it on wages above the
# threshold regardless of the employee's filing status.
[medicare]
employee_rate_ppm = 14500
employer_rate_ppm = 14500
additional_rate_ppm = 9000
additional_threshold = "200000.00"

# Federal Unemployment Tax Act. Employer-only.
# 6.0% gross less the 5.4% credit for timely state unemployment payments.
[futa]
gross_rate_ppm = 60000
state_credit_ppm = 54000
wage_base = "7000.00"
# A quarter's accumulated liability below this is carried forward instead of
# deposited. 26 CFR 31.6302(c)-3.
deposit_threshold = "500.00"

# Section 402(g) elective deferral limit, section 414(v) catch-up amounts, and
# the section 415(c) annual additions cap.
[retirement]
elective_deferral_limit = "24500.00"
catch_up_50_to_59_or_64_plus = "8000.00"
catch_up_60_to_63 = "11250.00"
annual_additions_limit = "72000.00"
compensation_limit = "360000.00"
# Prior-year Social Security wages above this force catch-up contributions to
# be Roth. SECURE 2.0 section 603, effective 2026.
roth_catch_up_wage_threshold = "150000.00"
# Section 414(v)(1): catch-up contributions begin in the year the employee
# attains this age.
catch_up_age = 50
# Section 414(v)(2)(E)(i), added by SECURE 2.0 section 109: the higher catch-up
# applies in the years the employee attains these ages, inclusive.
higher_catch_up_first_age = 60
higher_catch_up_last_age = 63
# Section 404(a)(3)(A)(i)(I): the employer may deduct contributions up to 25%
# of the compensation paid to the plan's participants.
employer_deduction_ppm = 250000
