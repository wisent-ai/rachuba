# Federal payroll tax parameters for calendar year 2026.
#
# Withholding schedules are transcribed from the "2026 Percentage Method Tables
# for Automated Payroll Systems", page 12 of:
#
#   IRS Publication 15-T (2026), Federal Income Tax Withholding Methods,
#   Catalog Number 32112B, revised 3 December 2025.
#   https://www.irs.gov/pub/irs-pdf/p15t.pdf
#
# Each bracket row is [at_least, base_tax, rate_ppm]. The upper bound of a
# bracket is the `at_least` of the following row; the final row is unbounded.
# `base_tax` is column C ("the tentative amount to withhold") and `rate_ppm` is
# column D expressed in parts per million, so 22% is 220000.
#
# To roll this crate to a new tax year: copy this file to federal-<year>.toml,
# replace the numbers from that year's Publication 15-T and the Social Security
# Administration wage base announcement, and update `year`. No code changes.

year = 2026
source = "IRS Publication 15-T (2026), Cat. No. 32112B, rev. 2025-12-03, page 12"

[withholding]
# Worksheet 1A line 1g: added to the Step 4(b) amount when the Step 2 checkbox
# is NOT checked, then subtracted from annualized wages.
standard_deduction_mfj = "12900.00"
standard_deduction_other = "8600.00"
# Worksheet 1A line 1k: value of one allowance on a 2019-or-earlier Form W-4.
allowance_value = "4300.00"

# STANDARD Withholding Rate Schedules.
# Used when the Form W-4 is from 2019 or earlier, or is from 2020 or later and
# the Step 2 checkbox is NOT checked.
