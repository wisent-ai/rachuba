# CONVENTIONS
#
# Bracket rows are [at_least, base_tax, rate_ppm], as in federal-2026.toml.
# The upper bound of a bracket is the `at_least` of the following row. Money is
# a decimal string; rates are integer parts per million, so 5.40% is 54000.
#
# The NY publications print five columns per row: column 1 "at least",
# column 2 "but less than", column 3 "subtract this amount from net wages",
# column 4 the rate, and column 5 "add the result to column 5 amount". In every
# row of every schedule transcribed below, column 3 EQUALS column 1, so the
# published formula
#     tax = column5 + column4 * (net_wages - column3)
# is exactly the [at_least, base_tax, rate_ppm] form used by this crate:
# base_tax is column 5 and rate_ppm is column 4 in ppm. This equality was
# checked row by row; do not assume it holds for a future revision without
# rechecking.
#
# Only the ANNUAL schedule is stored for each jurisdiction and filing status.
# The publications also print weekly, biweekly, semimonthly, monthly and daily
# variants of every schedule. Those are not transcribed because they are
# mechanically derivable from the annual schedule:
#
#     period_at_least = annual_at_least / periods_per_year,
#                       rounded half-to-even to `period_threshold_quantum`
#     period_base_tax = annual_base_tax / periods_per_year,
#                       rounded half-to-even to the cent
#     period_rate_ppm = annual_rate_ppm            (unchanged)
#
# That rule was checked against all 170 printed per-period rows across the
# three publications (New York State single and married, New York City single
# and married, five payroll periods each). It reproduces 170 of 170 exactly,
# given the per-jurisdiction `period_threshold_quantum` values below and the
# two `[[nyc.period_table_overrides]]` entries, which are the only printed
# values inconsistent with any single rounding rule.
#
# See local://ny-withholding-algorithm.md for the full step-by-step procedure,
# including where rounding happens and how Method III displaces the schedule.
#
# To roll this crate to a new tax year: copy this file to state-NY-<year>.toml,
# replace the numbers from that year's NYS-50-T-NYS, NYS-50-T-NYC, NYS-50-T-Y,
# the DFS Paid Family Leave rate announcement, and the NYS DOL UI rate notice,
# re-check the derivation rule against the new printed per-period tables, and
# update `year`. No code changes.

year = 2026
source = "NYS-50-T-NYS (1/26), NYS-50-T-NYC (1/26), NYS-50-T-Y (1/26), all rev. 1/26 and effective 2026-01-01 through 2026-12-31; Form NYS-50 (12/25) rev. 2025-12; NYS DOL 2026 UI rate notice; paidfamilyleave.ny.gov 2026 contribution announcement"

# Number of payroll periods in a year. Source [3] page 25 "Table P Annual
# Factors" gives daily 260, weekly 52, biweekly 26, semimonthly 24, monthly 12.
# Source [1] page 23 "Conversion of tables" derives quarterly as 3x monthly and
# supports the same factor arithmetic for semiannual periods. "daily" is the
# "daily or miscellaneous" payroll period of Tables A through C.
#
# Quarterly, semiannual and annual periods have no printed per-period schedule
# in any of the three publications, so for those the derivation rule above is
# the only available construction.
[payroll_periods]
daily = 260
weekly = 52
biweekly = 26
semimonthly = 24
monthly = 12
quarterly = 4
semiannual = 2
annual = 1

